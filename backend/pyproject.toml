[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]
